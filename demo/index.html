<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Review</title>
<!-- Pinned CDN versions; no build step. Needs internet for these four files. -->
<link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<style>
  html, body, #root { height: 100%; }
  html.big { font-size: 18px; }   /* projector mode: Tailwind rem sizes scale with this */
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
</style>
</head>
<body class="bg-base-200 text-base-content">
<div id="root"></div>
<script>
const { useState, useEffect, useRef } = React;
const html = htm.bind(React.createElement);

const LABEL = { DIFFERENT_ENTITY: "Cleared", SAME_ENTITY: "Confirmed", REVIEW: "Review" };
const TONE = { DIFFERENT_ENTITY: "badge-success", SAME_ENTITY: "badge-error", REVIEW: "badge-warning" };

async function api(path) {
  const r = await fetch(path);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || String(r.status));
  return body;
}

function store(key, fallback) {          // per-browser convenience only; safe if storage is blocked
  try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
}
function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }

const Badge = ({ d, size = "" }) => html`<span class=${"badge font-semibold whitespace-nowrap " + (TONE[d] || "badge-ghost") + " " + size}>${LABEL[d] || d}</span>`;
const Code = ({ children }) => html`<span class="mono text-xs opacity-70">${children}</span>`;
const None = ({ text = "none" }) => html`<span class="mono text-xs opacity-50">${text}</span>`;

function Chip({ id, onOpen }) {
  if (!id) return null;
  return html`<button class="btn btn-xs btn-outline mono normal-case font-normal" onClick=${() => onOpen(id)}>${id}</button>`;
}
const Chips = ({ ids, onOpen, empty = "no records cited" }) =>
  (ids && ids.length) ? html`<div class="flex flex-wrap gap-1">${ids.map((id) => html`<${Chip} key=${id} id=${id} onOpen=${onOpen} />`)}</div>` : html`<${None} text=${empty} />`;

function Facts({ facts, onOpen }) {
  const list = (facts || []).filter(Boolean);
  if (!list.length) return html`<${None} />`;
  return html`<div class="space-y-1">${list.map((f, i) => html`
    <div key=${i} class="flex flex-wrap items-center gap-1">
      <span>${String(f.value)}</span>${f.kind ? html`<${Code}>${f.kind}</${Code}>` : null}<${Chip} id=${f.source} onOpen=${onOpen} />
    </div>`)}</div>`;
}

function Row({ k, children }) {
  return html`<div class="grid grid-cols-[8.5rem_1fr] gap-3 py-1.5 border-b border-base-200 last:border-0">
    <div class="text-sm opacity-60">${k}</div><div class="text-sm min-w-0 break-words">${children}</div></div>`;
}

function Card({ title, dot, children, extra }) {
  return html`<div class="card bg-base-100 shadow-sm border border-base-300">
    <div class="card-body p-4 gap-2">
      ${title ? html`<h3 class="text-xs font-bold uppercase tracking-wider opacity-60 flex items-center gap-2">
        ${dot ? html`<span class=${"inline-block w-2 h-2 rounded-full " + dot}></span>` : null}${title}${extra}</h3>` : null}
      ${children}
    </div></div>`;
}

// ---------------------------------------------------------------- header

function Stats({ s }) {
  if (!s) return null;
  const n = (d) => Object.values(s.by_decision[d] || {}).reduce((a, b) => a + b, 0);
  const p = s.practice;
  return html`<div class="stats stats-horizontal shadow-sm bg-base-100 border border-base-300 overflow-x-auto max-w-full">
    <div class="stat py-2 px-4"><div class="stat-title text-xs">Hits</div><div class="stat-value text-xl">${s.hits}</div><div class="stat-desc">${s.alerts} alerts</div></div>
    <div class="stat py-2 px-4"><div class="stat-title text-xs">Cleared</div><div class="stat-value text-xl text-success">${n("DIFFERENT_ENTITY")}</div></div>
    <div class="stat py-2 px-4"><div class="stat-title text-xs">Confirmed</div><div class="stat-value text-xl text-error">${n("SAME_ENTITY")}</div></div>
    <div class="stat py-2 px-4"><div class="stat-title text-xs">To review</div><div class="stat-value text-xl text-warning">${n("REVIEW")}</div></div>
    ${p.n ? html`<div class="stat py-2 px-4"><div class="stat-title text-xs">Practice labels</div>
      <div class=${"stat-value text-xl " + (p.unsafe ? "text-error" : "text-success")}>${p.right}/${p.n}</div>
      <div class="stat-desc">score ${p.score}% · unsafe ${p.unsafe}</div></div>` : null}
    <div class="stat py-2 px-4"><div class="stat-title text-xs">Grok cross-examiner</div>
      <div class="stat-value text-base mono max-w-[14rem] truncate" title=${s.llm || "rules only"}>${s.llm || "rules only"}</div>
      <div class="stat-desc">${s.crossexam_downgrades || 0} clearance${s.crossexam_downgrades === 1 ? "" : "s"} sent back</div></div>
    <div class="stat py-2 px-4"><div class="stat-title text-xs">Engine run</div><div class="stat-value text-xl">${s.seconds}s</div><div class="stat-desc">${s.folder}</div></div>
  </div>`;
}

function Header({ s, theme, setTheme, big, setBig }) {
  return html`<header class="navbar bg-base-100 border-b border-base-300 px-4 gap-4 flex-wrap min-h-0 py-2">
    <div class="flex-none flex-col !items-start">
      <div class="text-lg font-bold leading-tight">Case Review</div>
      <div class="text-xs opacity-60">Sanctions screening: is the hit the customer?</div>
    </div>
    <div class="order-last lg:order-none w-full lg:w-auto lg:flex-1 lg:justify-end min-w-0"><${Stats} s=${s} /></div>
    <div class="flex-none flex gap-1">
      <button class=${"btn btn-sm " + (big ? "btn-active" : "btn-ghost")} title="Larger text for projectors" onClick=${() => setBig(!big)}>A+</button>
      <button class="btn btn-sm btn-ghost" title="Toggle light / dark" onClick=${() => setTheme(theme === "dark" ? "light" : "dark")}>${theme === "dark" ? "Light" : "Dark"}</button>
    </div>
  </header>`;
}

// ---------------------------------------------------------------- queue

function Queue({ codes, selected, onSelect }) {
  const [f, setF] = useState({ decision: "", reason: "", q: "", practice: false });
  const [rows, setRows] = useState(null);
  const [err, setErr] = useState("");
  const t = useRef(0);

  useEffect(() => {
    clearTimeout(t.current);
    t.current = setTimeout(() => {
      const qs = new URLSearchParams({ decision: f.decision, reason: f.reason, q: f.q, practice: f.practice ? "1" : "" });
      api("/api/hits?" + qs).then((r) => { setRows(r); setErr(""); }).catch((e) => setErr(e.message));
    }, f.q ? 180 : 0);
  }, [f]);

  const seg = [["", "All"], ["DIFFERENT_ENTITY", "Cleared"], ["SAME_ENTITY", "Confirmed"], ["REVIEW", "Review"]];
  return html`<section class="flex flex-col min-h-0 bg-base-100 border-r border-base-300">
    <div class="p-3 space-y-2 border-b border-base-300">
      <div class="join w-full">${seg.map(([v, l]) => html`
        <button key=${v} class=${"join-item btn btn-sm flex-1 " + (f.decision === v ? "btn-primary" : "")} onClick=${() => setF({ ...f, decision: v })}>${l}</button>`)}</div>
      <div class="flex gap-2 items-center">
        <select class="select select-sm select-bordered flex-1 min-w-0" value=${f.reason} onChange=${(e) => setF({ ...f, reason: e.target.value })}>
          <option value="">Any reason</option>${codes.map((c) => html`<option key=${c} value=${c}>${c}</option>`)}
        </select>
        <label class="label cursor-pointer gap-2 py-0"><span class="label-text text-xs whitespace-nowrap">Practice only</span>
          <input type="checkbox" class="toggle toggle-sm" checked=${f.practice} onChange=${(e) => setF({ ...f, practice: e.target.checked })} /></label>
      </div>
      <input type="search" class="input input-sm input-bordered w-full" placeholder="Search name, hit or customer ID" value=${f.q} onInput=${(e) => setF({ ...f, q: e.target.value })} />
    </div>
    <div class="text-xs opacity-60 px-3 py-1.5 border-b border-base-300">
      ${err ? html`<span class="text-error">${err}</span>` : rows ? `${rows.total} hit${rows.total === 1 ? "" : "s"}${rows.total > rows.rows.length ? ` (first ${rows.rows.length})` : ""}` : "Loading..."}
    </div>
    <ul class="overflow-auto flex-1">
      ${rows && !rows.rows.length ? html`<li class="p-8 text-center opacity-60">No hits match.</li>` : null}
      ${(rows ? rows.rows : []).map((x) => {
        const truth = x.truth ? (x.truth === x.decision
          ? html`<span class="text-xs text-success">label agrees</span>`
          : html`<span class="text-xs text-error font-semibold">label: ${LABEL[x.truth]}</span>`) : null;
        const on = x.hit_id === selected;
        return html`<li key=${x.hit_id}>
          <button class=${"w-full text-left px-3 py-2 border-b border-base-200 hover:bg-base-200 grid grid-cols-[auto_1fr_auto] gap-x-2 gap-y-0.5 items-center " + (on ? "bg-base-200 shadow-[inset_3px_0_0_oklch(var(--p))]" : "")}
            onClick=${() => onSelect(x.hit_id)}>
            <${Badge} d=${x.decision} size="badge-sm" />
            <span class="font-medium truncate">${x.hit_name}</span>${truth || html`<span></span>`}
            <span class="col-start-2 col-span-2 text-xs opacity-60 truncate">${x.hit_id} · screened as ${x.screened || "?"} · ${x.reason_code}</span>
          </button></li>`;
      })}
    </ul>
  </section>`;
}

// ---------------------------------------------------------------- case

function settleLine(x, people) {
  // "What would settle this": the gaps that keep a REVIEW from being decided.
  const out = [];
  const res = x.resolution;
  if (!people.length) out.push("finding which customer record this alert is about");
  if (people.length > 1) out.push(`knowing which of the ${people.length} customers fits the alert`);
  for (const m of (x.profile.missing || [])) out.push(m);
  people.forEach((p, i) => {
    const who = people.length > 1 ? ` (person ${i + 1})` : "";
    if (!(p.dobs || []).length && !p.verified_dob) out.push("a date of birth for the customer" + who);
    if (!(p.countries || []).length) out.push("a country for the customer" + who);
  });
  return [...new Set(out)];
}

function Court({ trial, onOpen }) {
  if (!trial) return html`<div class="grid md:grid-cols-2 gap-4">
    <${Card} title="Prosecution: same person" dot="bg-error"><div class="text-sm opacity-60">No customer resolved, so nothing to compare.</div></${Card}>
    <${Card} title="Defence: different person" dot="bg-success"><div class="text-sm opacity-60">No customer to test.</div></${Card}></div>`;
  return html`<div class="grid md:grid-cols-2 gap-4">
    <${Card} title="Prosecution: same person" dot="bg-error">
      ${trial.prosecution.length ? trial.prosecution.map((a, i) => html`
        <div key=${i} class="py-2 border-t border-base-200 first:border-0">
          <div class="font-semibold">${a.what}</div>
          <div class="text-sm opacity-70 mb-1">${a.detail}</div>
          <${Chips} ids=${a.sources} onOpen=${onOpen} />
        </div>`) : html`<div class="text-sm opacity-60">Nothing agrees.</div>`}
    </${Card}>
    <${Card} title="Defence: different person" dot="bg-success">
      ${trial.defence.map((a, i) => html`
        <div key=${i} class=${"py-2 border-t border-base-200 first:border-0 " + (a.holds ? "" : "opacity-60")}>
          <div class="flex items-center gap-2">
            <span class=${"badge badge-sm " + (a.holds ? "badge-success" : "badge-ghost")}>${a.holds ? "HOLDS" : "no"}</span>
            <span class=${a.holds ? "font-semibold" : ""}>${a.rule}</span>
          </div>
          <div class="text-sm opacity-70 mt-1">${a.detail}</div>
          ${a.note ? html`<div class="text-xs text-warning mt-1">${a.note}</div>` : null}
        </div>`)}
    </${Card}></div>`;
}

function Case({ hid, onOpen }) {
  const [x, setX] = useState(null);
  const [err, setErr] = useState("");
  const [person, setPerson] = useState(0);

  useEffect(() => {
    setX(null); setErr(""); setPerson(0);
    if (hid) api("/api/hit/" + encodeURIComponent(hid)).then(setX).catch((e) => setErr(e.message));
  }, [hid]);

  if (!hid) return html`<div class="h-full grid place-items-center opacity-60 p-8 text-center">Pick a hit in the queue to see the case.</div>`;
  if (err) return html`<div class="p-8"><div class="alert alert-error">${err}</div></div>`;
  if (!x) return html`<div class="h-full grid place-items-center"><span class="loading loading-spinner loading-lg"></span></div>`;

  const d = x.decision, prof = x.profile, res = x.resolution;
  const people = (res && res.people) || [];
  const p = people[person];
  const settle = d.decision === "REVIEW" ? settleLine(x, people) : [];
  const a = x.alert || {};

  return html`<div class="p-4 md:p-6 space-y-4 max-w-6xl">
    <div>
      <h2 class="text-2xl font-bold">${x.hit_raw.name}</h2>
      <div class="text-sm opacity-70 flex flex-wrap items-center gap-1 mt-1">
        <span>${d.hit_id} · alert</span><${Chip} id=${d.alert_id} onOpen=${onOpen} />
        <span>· screened as <b>${a.customer_name || "?"}</b>${a.dob ? ", born " + a.dob : ""}${a.country ? ", " + a.country : ""}${prof.listing_kind ? " · " + prof.listing_kind : ""}</span>
      </div>
    </div>

    <${Card} title="The ruling">
      <div class="flex flex-wrap items-center gap-3">
        <${Badge} d=${d.decision} size="badge-lg" /><${Code}>${d.reason_code}</${Code}>
        <${Code}>customer: ${d.customer_record_id == null ? "none found" : d.customer_record_id}</${Code}>
      </div>
      <p class="text-base">${d.reason}</p>
      <${Chips} ids=${d.evidence} onOpen=${onOpen} />
      ${settle.length ? html`<div class="alert alert-warning mt-2 py-2 text-sm items-start">
        <div><b>What would settle this:</b> ${settle.join("; ")}.</div></div>` : null}
    </${Card}>

    ${x.label ? html`<${Card} title="Practice label">
      <div class=${"flex flex-wrap items-center gap-2 text-sm " + (x.label.decision === d.decision ? "text-success" : "text-error font-semibold")}>
        ${x.label.decision === d.decision ? "Agrees with the reference answer" : "Reference answer differs"}:
        <${Badge} d=${x.label.decision} size="badge-sm" /><${Code}>${String(x.label.reason_codes || "")}</${Code}>
      </div>
      ${x.label.reference_reason ? html`<div class="text-sm opacity-70">${x.label.reference_reason}</div>` : null}
    </${Card}>` : null}

    ${people.length > 1 ? html`<div role="tablist" class="tabs tabs-boxed w-fit flex-wrap">${people.map((q, i) => html`
      <button key=${q.person_id} role="tab" class=${"tab " + (i === person ? "tab-active" : "")} onClick=${() => setPerson(i)}>Person ${i + 1}: ${q.person_id}</button>`)}</div>` : null}

    ${x.crossexam && x.crossexam.downgraded && x.crossexam.rules_decision ? html`<${Card} title="Cross-examined" dot="bg-warning"
        extra=${html`<span class="ml-auto font-normal normal-case tracking-normal"><${Code}>${x.crossexam.provider}</${Code}></span>`}>
      <div class="flex flex-wrap items-center gap-2 text-sm">
        <span>Rules wanted</span><${Badge} d=${x.crossexam.rules_decision.decision} size="badge-sm" /><${Code}>${x.crossexam.rules_decision.reason_code}</${Code}>
        <span class="opacity-60">→</span><span>Final</span><${Badge} d=${d.decision} size="badge-sm" /><${Code}>${d.reason_code}</${Code}>
      </div>
      <div class="text-sm"><span class="opacity-60">Rules' reason:</span> ${x.crossexam.rules_decision.reason}</div>
      <div class="text-sm"><span class="opacity-60">Why it was sent back:</span> ${d.reason}</div>
    </${Card}>` : null}

    <${Court} trial=${x.court[person]} onOpen=${onOpen} />

    <div class="grid md:grid-cols-2 gap-4">
      <${Card} title="Who the customer is">
        ${p ? html`<div>
          <${Row} k="Records"><${Chips} ids=${p.record_ids} onOpen=${onOpen} /></${Row}>
          <${Row} k="Verified name">${p.verified_name ? html`<${Facts} facts=${[p.verified_name]} onOpen=${onOpen} />` : html`<${None} />`}</${Row}>
          <${Row} k="Names on file"><${Facts} facts=${p.names} onOpen=${onOpen} /></${Row}>
          <${Row} k="Verified DOB">${p.verified_dob ? html`<${Facts} facts=${[p.verified_dob]} onOpen=${onOpen} />` : html`<${None} />`}</${Row}>
          <${Row} k="Declared DOBs"><${Facts} facts=${p.dobs} onOpen=${onOpen} /></${Row}>
          <${Row} k="Countries"><${Facts} facts=${p.countries} onOpen=${onOpen} /></${Row}>
          <${Row} k="Path"><${Chips} ids=${p.path} onOpen=${onOpen} empty="direct" /></${Row}>
        </div>` : null}
        ${res && res.note ? html`<div class="text-sm opacity-70">${res.note}</div>` : null}
      </${Card}>

      <${Card} title="Who the hit is">
        <div>
          <${Row} k="Names"><${Facts} facts=${prof.names} onOpen=${onOpen} /></${Row}>
          <${Row} k="Birth dates">${(prof.births || []).length ? html`<div class="space-y-1">${prof.births.map((b, i) => html`<div key=${i}>${String(b)}</div>`)}</div>` : html`<${None} text="none found" />`}</${Row}>
          <${Row} k="Countries"><${Facts} facts=${prof.countries} onOpen=${onOpen} /></${Row}>
          <${Row} k="Earliest report">${prof.earliest_report ? html`<${Facts} facts=${[prof.earliest_report]} onOpen=${onOpen} />` : html`<${None} />`}</${Row}>
          <${Row} k="Deceased">${prof.deceased ? html`<${Facts} facts=${[prof.deceased]} onOpen=${onOpen} />` : html`<${None} text="no" />`}</${Row}>
          <${Row} k="Type">${prof.entity_type}</${Row}>
        </div>
        ${(prof.missing || []).length ? html`<div class="mt-2">
          <div class="text-xs font-bold uppercase tracking-wider opacity-60 mb-1">Known unknowns</div>
          <ul class="list-disc pl-5 text-sm text-warning">${prof.missing.map((m, i) => html`<li key=${i}>${m}</li>`)}</ul></div>` : null}
      </${Card}>
    </div>
  </div>`;
}

// ---------------------------------------------------------------- record modal

function RecordModal({ id, onClose }) {
  const [r, setR] = useState(null);
  useEffect(() => {
    setR(null);
    if (id) api("/api/record/" + encodeURIComponent(id)).then(setR).catch(() => setR({ id, kind: "", missing: true }));
  }, [id]);
  useEffect(() => {
    const k = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", k);
    return () => document.removeEventListener("keydown", k);
  }, []);
  if (!id) return null;
  return html`<div class="modal modal-open" onClick=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
    <div class="modal-box max-w-3xl">
      <div class="flex justify-between items-center gap-2">
        <h3 class="font-bold mono">${id}${r && r.kind ? html` <span class="badge badge-ghost font-sans">${r.kind.replace("_", " ")}</span>` : null}</h3>
        <button class="btn btn-sm" onClick=${onClose}>Close</button>
      </div>
      ${!r ? html`<span class="loading loading-dots mt-4"></span>`
        : r.missing ? html`<p class="mt-3 opacity-70">Not found in the data folder.</p>`
        : html`<pre class="mono text-xs whitespace-pre-wrap break-words mt-3 bg-base-200 rounded-lg p-3">${JSON.stringify(r.row, null, 2)}</pre>`}
    </div></div>`;
}

// ---------------------------------------------------------------- app

function App() {
  const sys = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  const [theme, setTheme] = useState(store("cr-theme", sys));
  const [big, setBig] = useState(store("cr-big", false));
  const [status, setStatus] = useState("starting");
  const [ready, setReady] = useState(false);
  const [fatal, setFatal] = useState("");
  const [s, setS] = useState(null);
  const [sel, setSel] = useState(null);
  const [rec, setRec] = useState(null);

  useEffect(() => { document.documentElement.setAttribute("data-theme", theme); save("cr-theme", theme); }, [theme]);
  useEffect(() => { document.documentElement.classList.toggle("big", big); save("cr-big", big); }, [big]);
  useEffect(() => {
    let live = true;
    (async () => {
      try {
        for (;;) {
          const st = await api("/api/status");
          if (!live) return;
          if (st.ready) break;
          setStatus(st.status);
          await new Promise((r) => setTimeout(r, 700));
        }
        setS(await api("/api/summary"));
        setReady(true);
      } catch (e) { setFatal(e.message); }
    })();
    return () => { live = false; };
  }, []);

  if (fatal) return html`<div class="h-full grid place-items-center p-8"><div class="alert alert-error max-w-lg">Could not start: ${fatal}</div></div>`;
  if (!ready) return html`<div class="h-full grid place-items-center"><div class="flex items-center gap-3 opacity-70">
    <span class="loading loading-spinner"></span>Engine: ${status}...</div></div>`;

  const codes = [...new Set(Object.values(s.by_decision).flatMap((m) => Object.keys(m)))].sort();
  return html`<div class="h-full flex flex-col">
    <${Header} s=${s} theme=${theme} setTheme=${setTheme} big=${big} setBig=${setBig} />
    ${s.blindfold ? html`<div role="alert" class="alert alert-warning rounded-none py-2 justify-center font-semibold">
      Demo mode: note parser switched off</div>` : null}
    <main class="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-[minmax(20rem,36%)_1fr] grid-rows-[50vh_auto] lg:grid-rows-1 overflow-auto lg:overflow-hidden">
      <${Queue} codes=${codes} selected=${sel} onSelect=${setSel} />
      <section class="lg:overflow-auto min-w-0"><${Case} hid=${sel} onOpen=${setRec} /></section>
    </main>
    <${RecordModal} id=${rec} onClose=${() => setRec(null)} />
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
