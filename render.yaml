# Render Blueprint for the hosted Tryll demo (GUI only; scoring runs system/run from the repo).
# Loads ONLY the invented fixtures in tests/fixtures/rare: the dev dataset is participants-only
# and is never in this repo. Standard library Python, no build step (the UI is pre-built in demo/ui/dist).
services:
  - type: web
    name: tryll-demo
    runtime: python
    plan: free
    buildCommand: python --version
    startCommand: python -X utf8 demo/app.py tests/fixtures/rare --host 0.0.0.0
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DUAL_MODE
        value: advisory
      - key: TRYLL_DEMO_PASSCODE   # set in the dashboard to require a passcode (leave empty for an open demo)
        sync: false
      - key: XAI_API_KEY           # optional: enables the Grok cross-examiner and AI court; set it yourself in the dashboard
        sync: false
